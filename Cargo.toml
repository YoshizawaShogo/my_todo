[package]
name = "my_todo"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
jiff = "1.0.1"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
# ダブルクリックで起動したかどうか（コンソールを自分だけが使っているか）を調べる
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
# 配布する .exe を小さくする（デバッグ用のシンボルを除く）
strip = true

[lints.rust]
# unsafe は使わない（使う箇所は理由を書いて個別に許可する）
unsafe_code = "deny"

[lints.clippy]
# enum の match で「その他すべて（_）」を使わない。種類を足したときに対応漏れがコンパイルエラーになるように
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
